name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: viz_ecom_test
          POSTGRES_USER: viz_ecom
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U viz_ecom -d viz_ecom_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PDF_SANDBOX_TESTS: '1'
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: viz_ecom_test
      DB_USERNAME: viz_ecom
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated qpdf inspector
        run: docker build --tag viz-ecom-qpdf:local docker/pdf-inspector
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build public assets
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, pgsql, fileinfo, zip
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare test environment
        run: |
          cp .env.testing.example .env
          php artisan key:generate
      - name: Fetch pinned public PDF corpus
        run: php scripts/fetch-pdf-corpus.php
      - name: Run migrations and seeders
        run: php artisan migrate:fresh --seed --force
      - name: Run Pest on PostgreSQL
        run: composer test
      - name: Check Pint and Larastan
        run: composer lint
